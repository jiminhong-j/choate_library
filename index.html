<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choate English Library</title>
  <link rel="icon" id="favicon" href="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #f7f6f4;
      --surface: #ffffff;
      --text: #1d1b19;
      --muted: #75706a;
      --line: #e9e6e2;
      --brand: #f26522;
      --brand-soft: #fff1e9;
      --off-bg: #f1efec;
      --off-text: #6b665f;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 170px;
      height: 170px;
      object-fit: contain;
      margin: -24px 0 -20px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .search-wrap {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 12px 0 14px;
    }

    .search { position: relative; }

    .search svg {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      font: inherit;
      font-size: 17px;
      padding: 16px 48px 16px 50px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .search input::placeholder { color: #a8a29b; }

    .search input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(242,101,34,.14);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #eeebe7;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: none;
    }

    .clear-btn.show { display: block; }

    .filters {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .chip {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: .15s;
    }

    .chip:hover { border-color: #d3cec8; }

    .chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .status {
      font-size: 14px;
      color: var(--muted);
      margin: 6px 2px 12px;
      min-height: 20px;
    }

    .list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .list:empty { display: none; }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      transition: background .12s;
    }

    .row:last-child { border-bottom: none; }

    .row.clickable { cursor: pointer; }
    .row.clickable:hover { background: #fcfbfa; }

    .row:focus {
      outline: 2px solid var(--brand);
      outline-offset: -2px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .series {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      word-break: keep-all;
    }

    .btns {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 10px;
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s;
    }

    .btn img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #fff;
    }

    .btn.soundcloud {
      background: #fff3ec;
      color: #d9480f;
      border: 1px solid #ffd8c2;
    }
    .btn.soundcloud:hover { background: #ffe6d8; }

    .btn.everand {
      background: #f3f4f6;
      color: #2b2d31;
      border: 1px solid #dcdfe4;
    }
    .btn.everand:hover { background: #e8eaee; }

    .btn.youtube {
  background: #fff0f0;
  color: #cc0000;
  border: 1px solid #ffd0d0;
}
.btn.youtube:hover { background: #ffe0e0; }

.btn.link {
  background: #f3f4f6;
  color: #2b2d31;
  border: 1px solid #dcdfe4;
}
.btn.link:hover { background: #e8eaee; }

    .btn.off {
      background: var(--off-bg);
      color: var(--off-text);
      cursor: default;
      pointer-events: none;
    }

    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 15px;
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .empty .big {
      font-size: 32px;
      margin-bottom: 8px;
    }

    @media (max-width: 560px) {
      .container { padding: 24px 16px 48px; }
      .logo { width: 140px; height: 140px; margin: -20px 0 -16px; }
      .header h1 { font-size: 22px; }
      .search input { font-size: 16px; padding: 14px 44px 14px 46px; }
      .search svg { left: 15px; }

      .row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 16px;
      }

      .title { font-size: 16px; }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <img class="logo" id="logo" alt="Choate English 로고">
    <h1>Choate English Library</h1>
    <p>Find audio by book title, series name, or author.</p>
  </header>

  <div class="search-wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16.5" y2="16.5"></line>
      </svg>
      <input id="searchInput" type="text" placeholder="e.g., Magic Tree House, Roald Dahl" autocomplete="off" autofocus>
      <button id="clearBtn" class="clear-btn" aria-label="검색어 지우기">×</button>
    </div>

    <div class="filters" id="filters">
  <button class="chip active" data-filter="all">전체</button>
  <button class="chip" data-filter="soundcloud">SoundCloud</button>
  <button class="chip" data-filter="youtube">YouTube</button>   <!-- ← 이 줄 추가 -->
  <button class="chip" data-filter="everand">Everand</button>
  <button class="chip" data-filter="storytel">Storytel</button>
  <button class="chip" data-filter="audible">Audible</button>
</div>
  </div>

  <div id="status" class="status">데이터 불러오는 중...</div>

  <div id="results" class="list"></div>
  <div id="emptyBox"></div>

</div>

async function loadData() {
  try {
    const response = await fetch(SHEET_CSV_URL);
    if (!response.ok) throw new Error("CSV를 불러오지 못했습니다.");

    const csv = await response.text();
    const rows = parseCSV(csv);

    books = rows
      .slice(1)
      .map(row => {
        // C열부터 오른쪽 모든 열을 링크로 사용 (한 칸에 | 또는 줄바꿈으로 여러 개도 가능)
        const links = row.slice(2)
          .flatMap(c => String(c || "").split(/[\n|]+/))
          .map(l => l.trim())
          .filter(Boolean)
          .map(l => ({ url: l, source: detectSource(l) }));

        return {
          series: String(row[0] || "").trim(),
          title: String(row[1] || "").trim(),
          links: links
        };
      })
      .filter(book => book.title && book.links.length);

    statusDiv.textContent = "총 " + books.length + "권 · 검색어를 입력하세요";
  } catch (error) {
    console.error(error);
    statusDiv.textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
  }
}

function detectSource(link) {
  const t = link.toLowerCase();
  if (t.includes("youtube.com") || t.includes("youtu.be")) return "youtube";
  if (t.includes("soundcloud.com") || t.includes("snd.sc")) return "soundcloud";
  if (t.includes("everand")) return "everand";
  if (t.includes("storytel")) return "storytel";
  if (t.includes("audible")) return "audible";
  return "link"; // 모르는 사이트
}

input.addEventListener("input", () => {
  clearBtn.classList.toggle("show", input.value.length > 0);
  clearTimeout(timer);
  timer = setTimeout(search, 250);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

clearBtn.addEventListener("click", () => {
  input.value = "";
  clearBtn.classList.remove("show");
  input.focus();
  search();
});

filtersDiv.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filtersDiv.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  currentFilter = chip.dataset.filter;
  search();
});

function search() {
  const keyword = normalizeText(input.value);

  resultsDiv.innerHTML = "";
  emptyBox.innerHTML = "";

  if (books.length === 0) {
    statusDiv.textContent = "아직 데이터가 없습니다.";
    return;
  }

  if (!keyword && currentFilter === "all") {
    statusDiv.textContent = "총 " + books.length + "권 · 검색어를 입력하세요";
    return;
  }

  const results = books
    .filter(book => currentFilter === "all" || book.links.some(l => l.source === currentFilter))
    .filter(book => !keyword || normalizeText(book.series + " " + book.title).includes(keyword))
    .slice(0, 50);

  showResults(results);
}

function getOpenUrl(link) {
  const s = SOURCES[link.source];
  if (!s || !s.clickable) return null;
  if (isSafeUrl(link.url)) return link.url;
  return link.source === "everand" ? EVERAND_HOME : null;
}

function buttonHtml(link) {
  const s = SOURCES[link.source];
  const url = getOpenUrl(link);

  if (!s.clickable) {
    return `
      <span class="btn off" aria-disabled="true">
        <img src="${s.icon}" alt="">${s.label}
      </span>`;
  }

  if (!url) return "";

  return `
    <a class="btn ${link.source}" href="${escapeAttr(url)}" target="_blank"
       rel="noopener noreferrer" onclick="event.stopPropagation()">
      <img src="${s.icon}" alt="">${s.label}
    </a>`;
}

function showResults(results) {
  if (results.length === 0) {
    statusDiv.textContent = "";
    emptyBox.innerHTML = `
      <div class="empty">
        <div class="big">🔍</div>
        검색 결과가 없습니다.<br>다른 검색어로 찾아보세요.
      </div>`;
    return;
  }

  statusDiv.textContent = results.length + "권 검색됨" + (results.length === 50 ? " (최대 50권 표시)" : "");

  results.forEach(book => {
    const firstUrl = book.links.map(getOpenUrl).find(Boolean);
    const row = document.createElement("div");

    row.className = "row" + (firstUrl ? " clickable" : "");

    row.innerHTML = `
      <div class="info">
        ${book.series ? `<div class="series">${escapeHtml(book.series)}</div>` : ""}
        <div class="title">${escapeHtml(book.title)}</div>
      </div>
      <div class="btns">${book.links.map(buttonHtml).join("")}</div>
    `;

    if (firstUrl) {
      row.tabIndex = 0;
      row.addEventListener("click", () => window.open(firstUrl, "_blank", "noopener,noreferrer"));
      row.addEventListener("keydown", e => { if (e.key === "Enter") row.click(); });
    }

    resultsDiv.appendChild(row);
  });
}

function parseCSV(csv) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuote = false;

  for (let i = 0; i < csv.length; i++) {
    const char = csv[i];
    const next = csv[i + 1];

    if (char === '"' && insideQuote && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      insideQuote = !insideQuote;
    } else if (char === "," && !insideQuote) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !insideQuote) {
      if (char === "\r" && next === "\n") i++;
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function normalizeText(text) {
  return String(text || "").toLowerCase().trim().replace(/\s+/g, " ");
}

function isSafeUrl(url) {
  try {
    const u = new URL(url);
    return u.protocol === "https:" || u.protocol === "http:";
  } catch (e) {
    return false;
  }
}

function escapeHtml(text) {
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(text) {
  return escapeHtml(text);
}
