<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서관 책 검색</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    .header p {
      color: #666;
      margin: 0;
      font-size: 16px;
    }

    .search-box {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      font-size: 22px;
      padding: 16px 18px;
      border: 2px solid #d0d7e2;
      border-radius: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 4px rgba(26,115,232,.15);
    }

    .status {
      text-align: center;
      color: #777;
      margin: 16px 0;
      min-height: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,.07);
      cursor: pointer;
      transition: .15s;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }

    .card:focus {
      outline: 3px solid #1a73e8;
      outline-offset: 3px;
    }

    .series {
      color: #1a73e8;
      font-size: 14px;
      font-weight: bold;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
    }

    .open {
      align-self: flex-start;
      display: inline-block;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: bold;
      transition: background .2s;
    }

    .open:hover {
      background: #1558b0;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 16px;
      color: #777;
    }

    @media (max-width:600px) {
      .container {
        padding: 20px 14px;
      }

      .header h1 {
        font-size: 30px;
      }

      input {
        font-size: 18px;
      }

      .title {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📚 도서관 검색</h1>
    <p>책 제목 또는 시리즈명을 검색하세요</p>
  </div>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="예 : Big Nate, Bear Grylls..."
      autocomplete="off"
      autofocus>
  </div>

  <div id="status" class="status">
    데이터 불러오는 중...
  </div>

  <div id="results"></div>

</div>

<script>

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtm6nnGbtVLBjVjGK8kbT-jlfznB8KQi5kv_tlycasejrXMncdhotqmxcOJLP06HYfANgyiTsWBrQ3/pub?gid=1903997882&single=true&output=csv";

const input = document.getElementById("searchInput");
const statusDiv = document.getElementById("status");
const resultsDiv = document.getElementById("results");

let books = [];
let timer = null;

loadData();

async function loadData() {
  try {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("여기에_")) {
      statusDiv.textContent = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtm6nnGbtVLBjVjGK8kbT-jlfznB8KQi5kv_tlycasejrXMncdhotqmxcOJLP06HYfANgyiTsWBrQ3/pub?gid=1903997882&single=true&output=csv";
      return;
    }

    const response = await fetch(SHEET_CSV_URL);

    if (!response.ok) {
      throw new Error("CSV를 불러오지 못했습니다.");
    }

    const csv = await response.text();
    const rows = parseCSV(csv);

    books = rows
      .slice(1)
      .map(row => ({
        series: String(row[0] || "").trim(),
        title: String(row[1] || "").trim(),
        link: String(row[2] || "").trim()
      }))
      .filter(book => book.title && book.link);

    statusDiv.textContent = "검색어를 입력하세요.";
  } catch (error) {
    console.error(error);
    statusDiv.textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
  }
}

input.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(search, 300);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    search();
  }
});

function search() {
  const keyword = normalizeText(input.value);

  resultsDiv.innerHTML = "";

  if (!keyword) {
    statusDiv.textContent = "검색어를 입력하세요.";
    return;
  }

  if (books.length === 0) {
    statusDiv.textContent = "아직 데이터가 없습니다.";
    return;
  }

  const results = books
    .filter(book => normalizeText(book.series + " " + book.title).includes(keyword))
    .slice(0, 50);

  showResults(results);
}

function showResults(results) {
  resultsDiv.innerHTML = "";

  if (results.length === 0) {
    statusDiv.textContent = "";
    resultsDiv.innerHTML = "<div class='empty'>검색 결과가 없습니다.</div>";
    return;
  }

  statusDiv.textContent = results.length + "권 검색됨";

  results.forEach(book => {
    const card = document.createElement("div");

    card.className = "card";
    card.tabIndex = 0;

    card.innerHTML = `
      <div class="series">${escapeHtml(book.series)}</div>
      <div class="title">${escapeHtml(book.title)}</div>
      <a class="open"
         href="${escapeAttr(book.link)}"
         target="_blank"
         rel="noopener noreferrer"
         onclick="event.stopPropagation()">
         🎧 음원 링크 열기
      </a>
    `;

    card.addEventListener("click", () => {
      if (isSafeUrl(book.link)) {
        window.open(book.link, "_blank", "noopener,noreferrer");
      }
    });

    card.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        card.click();
      }
    });

    resultsDiv.appendChild(card);
  });
}

function parseCSV(csv) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuote = false;

  for (let i = 0; i < csv.length; i++) {
    const char = csv[i];
    const next = csv[i + 1];

    if (char === '"' && insideQuote && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      insideQuote = !insideQuote;
    } else if (char === "," && !insideQuote) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !insideQuote) {
      if (char === "\r" && next === "\n") {
        i++;
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function normalizeText(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}

function isSafeUrl(url) {
  try {
    const u = new URL(url);
    return u.protocol === "https:" || u.protocol === "http:";
  } catch (e) {
    return false;
  }
}

function escapeHtml(text) {
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(text) {
  return escapeHtml(text);
}
</script>

</body>
</html>
