<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choate English Library</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <style>
    :root {
      --bg: #f7f6f4;
      --surface: #ffffff;
      --text: #1d1b19;
      --muted: #75706a;
      --line: #e9e6e2;
      --brand: #f26522;          /* 로고 주황 */
      --brand-soft: #fff1e9;
      --soundcloud: #ff5500;
      --everand: #1e1e1e;
      --off-bg: #f1efec;         /* 클릭 안 되는 배지 */
      --off-text: #6b665f;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    /* ---------- 헤더 ---------- */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    /* ---------- 검색 ---------- */
    .search-wrap {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      padding: 12px 0 14px;
    }

    .search { position: relative; }

    .search svg {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--muted);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      font: inherit;
      font-size: 17px;
      padding: 16px 48px 16px 50px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .search input::placeholder { color: #a8a29b; }

    .search input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(242,101,34,.14);
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #eeebe7;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: none;
    }

    .clear-btn.show { display: block; }

    /* ---------- 필터 ---------- */
    .filters {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .chip {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: .15s;
    }

    .chip:hover { border-color: #d3cec8; }

    .chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    /* ---------- 상태 ---------- */
    .status {
      font-size: 14px;
      color: var(--muted);
      margin: 6px 2px 12px;
      min-height: 20px;
    }

    /* ---------- 결과 목록 ---------- */
    .list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .list:empty { display: none; }

    .row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      transition: background .12s;
    }

    .row:last-child { border-bottom: none; }

    .row.clickable { cursor: pointer; }
    .row.clickable:hover { background: #fcfbfa; }

    .row:focus {
      outline: 2px solid var(--brand);
      outline-offset: -2px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .series {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      word-break: keep-all;
    }

    /* ---------- 버튼 ---------- */
    .btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 10px;
      text-decoration: none;
      white-space: nowrap;
      transition: background .15s;
    }

    .btn img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #fff;
    }

    /* SoundCloud (클릭 가능) */
    .btn.soundcloud {
      background: var(--soundcloud);
      color: #fff;
    }
    .btn.soundcloud:hover { background: #e64d00; }

    /* Everand (클릭 가능) */
    .btn.everand {
      background: var(--everand);
      color: #fff;
    }
    .btn.everand:hover { background: #000; }

    /* Storytel · Audible (클릭 안 됨) */
    .btn.off {
      background: var(--off-bg);
      color: var(--off-text);
      cursor: default;
      pointer-events: none;
    }

    /* ---------- 빈 화면 ---------- */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 15px;
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .empty .big {
      font-size: 32px;
      margin-bottom: 8px;
    }

    /* ---------- 모바일 ---------- */
    @media (max-width: 560px) {
      .container { padding: 24px 16px 48px; }
      .logo { width: 96px; height: 96px; }
      .header h1 { font-size: 22px; }
      .search input { font-size: 16px; padding: 14px 44px 14px 46px; }
      .search svg { left: 15px; }

      .row {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 16px;
      }

      .title { font-size: 16px; }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <img class="logo" src="logo.png" alt="Choate English 로고" onerror="this.style.display='none'">
    <h1>Choate English Library</h1>
    <p>책 제목이나 시리즈명으로 음원을 찾아보세요</p>
  </header>

  <div class="search-wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16.5" y2="16.5"></line>
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="예: Big Nate, Bear Grylls"
        autocomplete="off"
        autofocus>
      <button id="clearBtn" class="clear-btn" aria-label="검색어 지우기">×</button>
    </div>

    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">전체</button>
      <button class="chip" data-filter="soundcloud">SoundCloud</button>
      <button class="chip" data-filter="everand">Everand</button>
      <button class="chip" data-filter="storytel">Storytel</button>
      <button class="chip" data-filter="audible">Audible</button>
    </div>
  </div>

  <div id="status" class="status">데이터 불러오는 중...</div>

  <div id="results" class="list"></div>
  <div id="emptyBox"></div>

</div>

<script>

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtm6nnGbtVLBjVjGK8kbT-jlfznB8KQi5kv_tlycasejrXMncdhotqmxcOJLP06HYfANgyiTsWBrQ3/pub?gid=1903997882&single=true&output=csv";

const EVERAND_HOME = "https://www.everand.com/home";

const SOURCES = {
  soundcloud: { label: "SoundCloud", icon: "https://www.google.com/s2/favicons?domain=soundcloud.com&sz=64", clickable: true },
  everand:    { label: "Everand",    icon: "https://www.google.com/s2/favicons?domain=everand.com&sz=64",    clickable: true },
  storytel:   { label: "Storytel",   icon: "https://www.google.com/s2/favicons?domain=storytel.com&sz=64",   clickable: false },
  audible:    { label: "Audible",    icon: "https://www.google.com/s2/favicons?domain=audible.com&sz=64",    clickable: false }
};

const input = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
const statusDiv = document.getElementById("status");
const resultsDiv = document.getElementById("results");
const emptyBox = document.getElementById("emptyBox");
const filtersDiv = document.getElementById("filters");

let books = [];
let timer = null;
let currentFilter = "all";

loadData();

async function loadData() {
  try {
    const response = await fetch(SHEET_CSV_URL);
    if (!response.ok) throw new Error("CSV를 불러오지 못했습니다.");

    const csv = await response.text();
    const rows = parseCSV(csv);

    books = rows
      .slice(1)
      .map(row => {
        const link = String(row[2] || "").trim();
        return {
          series: String(row[0] || "").trim(),
          title: String(row[1] || "").trim(),
          link: link,
          source: detectSource(link)
        };
      })
      .filter(book => book.title && book.link);

    statusDiv.textContent = "총 " + books.length + "권 · 검색어를 입력하세요";
  } catch (error) {
    console.error(error);
    statusDiv.textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
  }
}

/*
  C열(링크) 내용으로 구분
  - "Storytel" → Storytel (클릭 안 됨)
  - "Audible"  → Audible  (클릭 안 됨)
  - "Everand"  → Everand  (클릭 시 everand 열림)
  - 그 외 링크  → SoundCloud 음원
*/
function detectSource(link) {
  const t = link.toLowerCase();
  if (t.includes("storytel")) return "storytel";
  if (t.includes("audible")) return "audible";
  if (t.includes("everand")) return "everand";
  return "soundcloud";
}

/* ---------- 이벤트 ---------- */

input.addEventListener("input", () => {
  clearBtn.classList.toggle("show", input.value.length > 0);
  clearTimeout(timer);
  timer = setTimeout(search, 250);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

clearBtn.addEventListener("click", () => {
  input.value = "";
  clearBtn.classList.remove("show");
  input.focus();
  search();
});

filtersDiv.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;

  filtersDiv.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  currentFilter = chip.dataset.filter;
  search();
});

/* ---------- 검색 ---------- */

function search() {
  const keyword = normalizeText(input.value);

  resultsDiv.innerHTML = "";
  emptyBox.innerHTML = "";

  if (books.length === 0) {
    statusDiv.textContent = "아직 데이터가 없습니다.";
    return;
  }

  if (!keyword && currentFilter === "all") {
    statusDiv.textContent = "총 " + books.length + "권 · 검색어를 입력하세요";
    return;
  }

  const results = books
    .filter(book => currentFilter === "all" || book.source === currentFilter)
    .filter(book => !keyword || normalizeText(book.series + " " + book.title).includes(keyword))
    .slice(0, 50);

  showResults(results);
}

function getOpenUrl(book) {
  if (book.source === "everand") return isSafeUrl(book.link) ? book.link : EVERAND_HOME;
  if (book.source === "soundcloud") return isSafeUrl(book.link) ? book.link : null;
  return null; // storytel, audible : 열지 않음
}

function buttonHtml(book, url) {
  const s = SOURCES[book.source];

  if (!s.clickable) {
    return `
      <span class="btn off" aria-disabled="true">
        <img src="${s.icon}" alt="">${s.label}
      </span>`;
  }

  if (!url) return "";

  return `
    <a class="btn ${book.source}" href="${escapeAttr(url)}" target="_blank"
       rel="noopener noreferrer" onclick="event.stopPropagation()">
      <img src="${s.icon}" alt="">${s.label}
    </a>`;
}

function showResults(results) {
  if (results.length === 0) {
    statusDiv.textContent = "";
    emptyBox.innerHTML = `
      <div class="empty">
        <div class="big">🔍</div>
        검색 결과가 없습니다.<br>다른 검색어로 찾아보세요.
      </div>`;
    return;
  }

  statusDiv.textContent = results.length + "권 검색됨" + (results.length === 50 ? " (최대 50권 표시)" : "");

  results.forEach(book => {
    const url = getOpenUrl(book);
    const row = document.createElement("div");

    row.className = "row" + (url ? " clickable" : "");

    row.innerHTML = `
      <div class="info">
        ${book.series ? `<div class="series">${escapeHtml(book.series)}</div>` : ""}
        <div class="title">${escapeHtml(book.title)}</div>
      </div>
      ${buttonHtml(book, url)}
    `;

    if (url) {
      row.tabIndex = 0;
      row.addEventListener("click", () => window.open(url, "_blank", "noopener,noreferrer"));
      row.addEventListener("keydown", e => { if (e.key === "Enter") row.click(); });
    }

    resultsDiv.appendChild(row);
  });
}

/* ---------- 유틸 ---------- */

function parseCSV(csv) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuote = false;

  for (let i = 0; i < csv.length; i++) {
    const char = csv[i];
    const next = csv[i + 1];

    if (char === '"' && insideQuote && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      insideQuote = !insideQuote;
    } else if (char === "," && !insideQuote) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !insideQuote) {
      if (char === "\r" && next === "\n") i++;
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
    } else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function normalizeText(text) {
  return String(text || "").toLowerCase().trim().replace(/\s+/g, " ");
}

function isSafeUrl(url) {
  try {
    const u = new URL(url);
    return u.protocol === "https:" || u.protocol === "http:";
  } catch (e) {
    return false;
  }
}

function escapeHtml(text) {
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(text) {
  return escapeHtml(text);
}
</script>

</body>
</html>
